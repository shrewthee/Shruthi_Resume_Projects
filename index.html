<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Randomizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a1628;
      color: #ffffff;
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 { font-size: 2.5rem; color: #ffffff; letter-spacing: 0.02em; }
    header p { color: #7a9cc4; margin-top: 0.5rem; font-size: 1rem; }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    input {
      padding: 0.7rem 1rem;
      border: 2px solid #1e3a5f;
      border-radius: 8px;
      font-size: 1rem;
      width: 250px;
      outline: none;
      background: #112240;
      color: #ffffff;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #4a6fa5; }
    input:focus { border-color: #4a90d9; }

    button {
      padding: 0.7rem 1.5rem;
      background: #1e3a5f;
      color: white;
      border: 2px solid #4a90d9;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      font-weight: 600;
    }
    button:hover { background: #4a90d9; border-color: #4a90d9; }
    button.secondary {
      background: transparent;
      color: #ffffff;
      border: 2px solid #ffffff;
    }
    button.secondary:hover { background: #ffffff; color: #0a1628; }

    #recipe-card {
      max-width: 800px;
      margin: 0 auto;
      background: #112240;
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
      border: 1px solid #1e3a5f;
      overflow: hidden;
      display: none;
    }
    #recipe-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-bottom: 3px solid #1e3a5f;
    }
    .card-body { padding: 2rem; }
    .card-body h2 { font-size: 1.8rem; color: #ffffff; margin-bottom: 0.5rem; }
    .tags { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tag {
      background: #1e3a5f;
      color: #7ab8f5;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #4a90d9;
    }
    h3 {
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: #7a9cc4;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
    ul li {
      background: #1e3a5f;
      color: #d0e8ff;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      border: 1px solid #2a4a7f;
    }
    .instructions {
      line-height: 1.8;
      color: #a8c4e0;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }
    .youtube-btn {
      display: inline-block;
      background: #ff0000;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: #4a6fa5;
      display: none;
      padding: 2rem;
    }
    #error {
      text-align: center;
      color: #ff6b6b;
      display: none;
      padding: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <h1>🍽️ Recipe Randomizer</h1>
  <p>Discover something delicious to cook tonight</p>
</header>

<div class="controls">
  <input type="text" id="ingredient-input" placeholder="Enter an ingredient (e.g. chicken)" />
  <button onclick="searchByIngredient()">Find Recipe</button>
  <button class="secondary" onclick="getRandom()">🎲 Surprise Me</button>
</div>

<div id="loading">Finding something delicious... 🍳</div>
<div id="error"></div>

<div id="recipe-card">
  <img id="meal-img" src="" alt="meal" />
  <div class="card-body">
    <h2 id="meal-name"></h2>
    <div class="tags">
      <span class="tag" id="meal-category"></span>
      <span class="tag" id="meal-area"></span>
    </div>
    <h3>Ingredients</h3>
    <ul id="meal-ingredients"></ul>
    <h3>Instructions</h3>
    <div class="instructions" id="meal-instructions"></div>
    <a id="meal-youtube" href="#" target="_blank" class="youtube-btn" style="display:none">▶ Watch on YouTube</a>
  </div>
</div>

<script>
  async function fetchMeal(url) {
    const card = document.getElementById("recipe-card");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    card.style.display = "none";
    error.style.display = "none";
    loading.style.display = "block";

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("No meals found. Try a different ingredient!");
      const meal = await res.json();
      if (meal.error) throw new Error(meal.error);
      displayMeal(meal);
    } catch (err) {
      error.textContent = err.message;
      error.style.display = "block";
    } finally {
      loading.style.display = "none";
    }
  }

  function getRandom() { fetchMeal("/api/random"); }

  function searchByIngredient() {
    const val = document.getElementById("ingredient-input").value.trim();
    if (!val) return alert("Please enter an ingredient!");
    fetchMeal(`/api/search?ingredient=${encodeURIComponent(val)}`);
  }

  function displayMeal(meal) {
    document.getElementById("meal-img").src = meal.image;
    document.getElementById("meal-name").textContent = meal.name;
    document.getElementById("meal-category").textContent = meal.category;
    document.getElementById("meal-area").textContent = meal.area;
    document.getElementById("meal-instructions").textContent = meal.instructions;

    const ul = document.getElementById("meal-ingredients");
    ul.innerHTML = meal.ingredients.map(i => `<li>${i}</li>`).join("");

    const ytBtn = document.getElementById("meal-youtube");
    if (meal.youtube) {
      ytBtn.href = meal.youtube;
      ytBtn.style.display = "inline-block";
    } else {
      ytBtn.style.display = "none";
    }

    document.getElementById("recipe-card").style.display = "block";
    document.getElementById("recipe-card").scrollIntoView({ behavior: "smooth" });
  }

  getRandom();
</script>

</body>
</html>
