<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: #000000;
      color: #00ff41;
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 2.5rem;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
      letter-spacing: 0.1em;
    }
    header p { color: #008f11; margin-top: 0.5rem; }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: #0d0d0d;
      border-radius: 4px;
      border: 1px solid #00ff41;
      box-shadow: 0 0 20px rgba(0,255,65,0.2), inset 0 0 20px rgba(0,255,65,0.02);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    select, input[type="number"] {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid #00ff41;
      border-radius: 4px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      background: #000000;
      color: #00ff41;
      outline: none;
      transition: box-shadow 0.2s;
      min-width: 120px;
    }
    select:focus, input:focus {
      box-shadow: 0 0 8px rgba(0,255,65,0.6);
    }
    select option { background: #000000; color: #00ff41; }

    button {
      width: 100%;
      padding: 0.8rem;
      background: #000000;
      color: #00ff41;
      border: 1px solid #00ff41;
      border-radius: 4px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.1em;
      transition: background 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
      text-transform: uppercase;
    }
    button:hover {
      background: #00ff41;
      color: #000000;
      box-shadow: 0 0 12px rgba(0,255,65,0.6);
    }

    .swap-btn {
      width: auto;
      padding: 0.7rem 1rem;
      margin-top: 0;
    }

    .result-box {
      text-align: center;
      padding: 1.5rem;
      background: #000000;
      border-radius: 4px;
      margin-top: 1.5rem;
      border: 1px solid #008f11;
      display: none;
    }
    .result-box .amount {
      font-size: 2rem;
      font-weight: 700;
      color: #00ff41;
      text-shadow: 0 0 8px #00ff41;
    }
    .result-box .rate {
      color: #008f11;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .result-box .updated {
      color: #005c0a;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .history-card {
      max-width: 500px;
      margin: 0 auto;
      background: #0d0d0d;
      border-radius: 4px;
      border: 1px solid #00ff41;
      box-shadow: 0 0 20px rgba(0,255,65,0.1);
      padding: 1.5rem;
      display: none;
    }
    .history-card h3 {
      font-size: 0.85rem;
      color: #008f11;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid #1a1a1a;
      font-size: 0.9rem;
      color: #00cc33;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item span { color: #00ff41; font-weight: 700; text-shadow: 0 0 6px #00ff41; }

    #loading { text-align: center; color: #008f11; display: none; padding: 1rem; letter-spacing: 0.1em; }
    #error { text-align: center; color: #ff0000; display: none; padding: 1rem; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <h1> CURRENCY CONVERTER</h1>
  <p>// live exchange rates from around the world</p>
</header>

<div class="card">
  <div class="row">
    <input type="number" id="amount" value="1" min="0" step="any" />
    <button class="swap-btn" onclick="swapCurrencies()" title="Swap">⇄</button>
  </div>
  <div class="row">
    <select id="from-currency"></select>
    <select id="to-currency"></select>
  </div>
  <button onclick="convert()">[ Convert ]</button>

  <div id="loading">> converting...</div>
  <div id="error"></div>

  <div class="result-box" id="result-box">
    <div class="amount" id="result-amount"></div>
    <div class="rate" id="result-rate"></div>
    <div class="updated" id="result-updated"></div>
  </div>
</div>

<div class="history-card" id="history-card">
  <h3>>> recent_conversions.log</h3>
  <div id="history-list"></div>
</div>

<script>
  let history = [];

  async function loadCurrencies() {
    const res = await fetch("/api/currencies");
    const codes = await res.json();
    const fromEl = document.getElementById("from-currency");
    const toEl = document.getElementById("to-currency");

    codes.forEach(([code, name]) => {
      const opt1 = new Option(`${code} — ${name}`, code);
      const opt2 = new Option(`${code} — ${name}`, code);
      fromEl.add(opt1);
      toEl.add(opt2);
    });

    fromEl.value = "USD";
    toEl.value = "EUR";
  }

  async function convert() {
    const amount = document.getElementById("amount").value;
    const from = document.getElementById("from-currency").value;
    const to = document.getElementById("to-currency").value;
    const resultBox = document.getElementById("result-box");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    resultBox.style.display = "none";
    error.style.display = "none";
    loading.style.display = "block";

    try {
      const res = await fetch(`/api/convert?from=${from}&to=${to}&amount=${amount}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      document.getElementById("result-amount").textContent = `${data.amount} ${from} = ${data.result} ${to}`;
      document.getElementById("result-rate").textContent = `1 ${from} = ${data.rate} ${to}`;
      document.getElementById("result-updated").textContent = `// updated: ${data.last_updated}`;
      resultBox.style.display = "block";

      addToHistory(amount, from, to, data.result);
    } catch (err) {
      error.textContent = err.message;
      error.style.display = "block";
    } finally {
      loading.style.display = "none";
    }
  }

  function swapCurrencies() {
    const from = document.getElementById("from-currency");
    const to = document.getElementById("to-currency");
    const temp = from.value;
    from.value = to.value;
    to.value = temp;
  }

  function addToHistory(amount, from, to, result) {
    history.unshift({ amount, from, to, result });
    if (history.length > 5) history.pop();

    const list = document.getElementById("history-list");
    const card = document.getElementById("history-card");

    list.innerHTML = history.map(h =>
      `<div class="history-item">> ${h.amount} ${h.from} → ${h.to} <span>${h.result}</span></div>`
    ).join("");

    card.style.display = "block";
  }

  loadCurrencies();
</script>

</body>
</html>
